name: Pipeline tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas scikit-learn scipy nltk textblob textstat inflect contractions joblib pytest
      - name: Run pipeline tests
        run: python -m pytest tests/test_pipeline.py -q
